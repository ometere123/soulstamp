name: SoulStamp CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_live:
        description: "Run the real Studionet deployment and lifecycle proof"
        required: true
        type: boolean
        default: false

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      GENVM_VERSION: v0.2.16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Python test and lint tools
        run: python -m pip install -r requirements-dev.txt
      - name: Install repository-local GenLayer CLI 0.39.1
        run: npm ci
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Install Worker dependencies
        run: npm ci --prefix backend
      - name: GenVM lint and semantic validation
        run: python scripts/contract_gates.py
      - name: Direct Mode and regression tests
        run: npm run test:all
      - name: Frontend production build
        run: npm --prefix frontend run build
      - name: Discord Worker syntax check
        run: npm --prefix backend run check

  live-studionet:
    if: ${{ vars.RUN_STUDIONET_LIVE == 'true' || (github.event_name == 'workflow_dispatch' && inputs.run_live == true) }}
    runs-on: ubuntu-latest
    needs: gates
    env:
      GENVM_VERSION: v0.2.16
      RUN_LIVE_STUDIONET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - name: Execute real Studionet lifecycle proof
        env:
          GENLAYER_PRIVATE_KEY: ${{ secrets.GENLAYER_PRIVATE_KEY }}
          SOULSTAMP_ADMIN_ADDRESS: ${{ vars.SOULSTAMP_ADMIN_ADDRESS }}
        run: python scripts/live_studionet_proof.py
